<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 950" role="img" aria-labelledby="title desc">
  <title id="title">STTCNN method at a glance, mobile layout</title>
  <desc id="desc">A vertical flow from scalp-aligned electrode reordering through parallel TimesNet and spatial convolution branches to feature fusion, LSTM, and Parkinson's versus control classification.</desc>
  <rect width="600" height="950" fill="#f8f3ec"/>
  <text x="28" y="42" fill="#a95018" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="2">PUBLISHED RESEARCH / EEG</text>
  <text x="28" y="88" fill="#292522" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700">STTCNN method</text>
  <text x="28" y="121" fill="#6e6862" font-family="Arial,Helvetica,sans-serif" font-size="20">Topology + parallel temporal/spatial views</text>

  <rect x="27" y="150" width="546" height="162" rx="20" fill="#fffdf9" stroke="#decfbe" stroke-width="2"/>
  <text x="51" y="183" fill="#a95018" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">01 / SCALP TOPOLOGY</text>
  <text x="51" y="220" fill="#292522" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">Reorder 60 EEG electrodes</text>
  <ellipse cx="109" cy="270" rx="46" ry="29" fill="#e8f3f3" stroke="#7eaaad" stroke-width="2"/>
  <g fill="#427b91"><circle cx="76" cy="269" r="5"/><circle cx="96" cy="258" r="5"/><circle cx="116" cy="258" r="5"/><circle cx="137" cy="269" r="5"/><circle cx="96" cy="281" r="5"/><circle cx="116" cy="281" r="5"/></g>
  <path d="M171 270h60M222 263l10 7-10 7" fill="none" stroke="#d58146" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="246" y="246" width="276" height="48" rx="10" fill="#e8f3f3"/>
  <text x="264" y="277" fill="#326b80" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700">Scalp-aligned sequence</text>

  <path d="M300 313v28M293 333l7 9 7-9" fill="none" stroke="#d58146" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="27" y="347" width="546" height="173" rx="20" fill="#f3f8f8" stroke="#b5d1d5" stroke-width="2"/>
  <text x="51" y="382" fill="#35748a" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">02A / TEMPORAL BRANCH</text>
  <text x="51" y="421" fill="#292522" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">TimesNet</text>
  <text x="51" y="450" fill="#6e6862" font-family="Arial,Helvetica,sans-serif" font-size="20">Within- and between-period patterns</text>
  <path d="M55 488l23-20 24 24 24-35 23 31 24-18 22 17 23-31 22 28 24-18 24 13 24-25 23 29 24-19 24 17 24-33 24 30 24-13" fill="none" stroke="#3c91ad" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="27" y="538" width="546" height="173" rx="20" fill="#f9e6d2" stroke="#e2b892" stroke-width="2"/>
  <text x="51" y="573" fill="#9f4e1b" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">02B / SPATIAL BRANCH</text>
  <text x="51" y="611" fill="#292522" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">Progressive convolution</text>
  <text x="51" y="641" fill="#6e6862" font-family="Arial,Helvetica,sans-serif" font-size="20">Electrode → region → global</text>
  <g fill="#cb7d4b"><rect x="55" y="663" width="24" height="24" rx="4"/><rect x="87" y="663" width="24" height="24" rx="4"/><rect x="119" y="663" width="24" height="24" rx="4"/></g>
  <path d="M162 675h48M201 668l10 7-10 7" fill="none" stroke="#9f4e1b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#e1a36d"><rect x="229" y="663" width="46" height="24" rx="4"/><rect x="284" y="663" width="46" height="24" rx="4"/></g>
  <path d="M350 675h48M389 668l10 7-10 7" fill="none" stroke="#9f4e1b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="417" y="663" width="93" height="24" rx="4" fill="#a95b31"/>

  <path d="M300 712v27M293 731l7 9 7-9" fill="none" stroke="#d58146" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="27" y="744" width="546" height="151" rx="20" fill="#fffdf9" stroke="#decfbe" stroke-width="2"/>
  <text x="51" y="780" fill="#a95018" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">03 / FUSION + DECISION</text>
  <text x="51" y="817" fill="#292522" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">Fuse both views → LSTM</text>
  <rect x="51" y="840" width="111" height="35" rx="17" fill="#a95018"/><text x="106" y="865" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700">PD</text>
  <rect x="180" y="840" width="130" height="35" rx="17" fill="#427b91"/><text x="245" y="865" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700">Control</text>
  <text x="28" y="926" fill="#6e6862" font-family="Arial,Helvetica,sans-serif" font-size="19">Public Oddball EEG · 24 matched pairs</text>
</svg>
