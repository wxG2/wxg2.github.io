<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">STTCNN method at a glance</title>
  <desc id="desc">Scalp-aligned EEG electrodes feed two parallel branches: TimesNet temporal modeling and progressive spatial convolution. Features are fused and passed through an LSTM to classify Parkinson's disease versus control.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf5"/><stop offset="1" stop-color="#f2e9de"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9e4ce"/><stop offset="1" stop-color="#f4d5b4"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#paper)"/>
  <text x="45" y="55" fill="#a95018" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="3">PUBLISHED RESEARCH  /  EEG</text>
  <text x="45" y="112" fill="#292522" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="700">Topology-aware EEG classification</text>
  <text x="45" y="150" fill="#6e6862" font-family="Arial,Helvetica,sans-serif" font-size="20">A compact redrawing of the STTCNN pipeline from Gao et al.</text>

  <rect x="44" y="187" width="284" height="354" rx="22" fill="#fffdf9" stroke="#decfbe" stroke-width="2"/>
  <text x="68" y="225" fill="#b15b22" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="2">01  /  INPUT</text>
  <text x="68" y="264" fill="#292522" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Scalp topology</text>
  <ellipse cx="183" cy="379" rx="78" ry="88" fill="#f2f7f6" stroke="#7eaaad" stroke-width="2"/>
  <path d="M183 291v176M105 379h156M132 320h102M132 435h102" stroke="#a7c7c5" stroke-width="2" opacity=".55"/>
  <g fill="#427b91">
    <circle cx="183" cy="315" r="7"/><circle cx="151" cy="335" r="7"/><circle cx="183" cy="340" r="7"/><circle cx="215" cy="335" r="7"/>
    <circle cx="126" cy="376" r="7"/><circle cx="155" cy="375" r="7"/><circle cx="183" cy="375" r="7"/><circle cx="211" cy="375" r="7"/><circle cx="240" cy="376" r="7"/>
    <circle cx="151" cy="414" r="7"/><circle cx="183" cy="411" r="7"/><circle cx="215" cy="414" r="7"/>
    <circle cx="166" cy="444" r="7"/><circle cx="200" cy="444" r="7"/>
  </g>
  <text x="68" y="501" fill="#6e6862" font-family="Arial,Helvetica,sans-serif" font-size="18">60 channels reordered by</text>
  <text x="68" y="525" fill="#6e6862" font-family="Arial,Helvetica,sans-serif" font-size="18">electrode position</text>

  <path d="M329 365h39M357 354l13 11-13 11" fill="none" stroke="#d58146" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="390" y="187" width="404" height="160" rx="22" fill="#f3f8f8" stroke="#b5d1d5" stroke-width="2"/>
  <text x="418" y="224" fill="#35748a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="2">02A  /  TEMPORAL BRANCH</text>
  <text x="418" y="263" fill="#292522" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">TimesNet</text>
  <path d="M418 310l18-15 19 21 18-29 18 27 19-12 18 12 19-32 18 28 18-12 19 7 18-20 19 25 18-18 18 15 19-28" fill="none" stroke="#3c91ad" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="671" y="263" fill="#6e6862" font-family="Arial,Helvetica,sans-serif" font-size="17">periodic variation</text>

  <rect x="390" y="381" width="404" height="160" rx="22" fill="url(#warm)" stroke="#e2b892" stroke-width="2"/>
  <text x="418" y="418" fill="#9f4e1b" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="2">02B  /  SPATIAL BRANCH</text>
  <text x="418" y="457" fill="#292522" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Progressive convolution</text>
  <g fill="#cb7d4b"><rect x="420" y="485" width="24" height="24" rx="4"/><rect x="452" y="485" width="24" height="24" rx="4"/><rect x="484" y="485" width="24" height="24" rx="4"/></g>
  <path d="M523 497h26M541 490l9 7-9 7" fill="none" stroke="#9f4e1b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#e1a36d"><rect x="564" y="485" width="38" height="24" rx="4"/><rect x="610" y="485" width="38" height="24" rx="4"/></g>
  <path d="M662 497h26M680 490l9 7-9 7" fill="none" stroke="#9f4e1b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="703" y="485" width="61" height="24" rx="4" fill="#a95b31"/>
  <text x="420" y="528" fill="#6e6862" font-family="Arial,Helvetica,sans-serif" font-size="17">electrode  →  region  →  global</text>

  <path d="M795 267h30v99h22M795 460h30v-94h22" fill="none" stroke="#d58146" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="851" cy="366" r="13" fill="#e58b48"/><path d="M846 366h10M851 361v10" stroke="#fffaf5" stroke-width="3" stroke-linecap="round"/>

  <rect x="873" y="187" width="282" height="354" rx="22" fill="#fffdf9" stroke="#decfbe" stroke-width="2"/>
  <text x="898" y="225" fill="#b15b22" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="2">03  /  DECISION</text>
  <text x="898" y="264" fill="#292522" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Fuse + model</text>
  <rect x="913" y="305" width="202" height="54" rx="12" fill="#f7e8d8" stroke="#e8c6a8"/>
  <text x="1014" y="339" text-anchor="middle" fill="#814b29" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700">Feature fusion</text>
  <path d="M1014 361v31M1006 384l8 9 8-9" fill="none" stroke="#d58146" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="944" y="404" width="140" height="52" rx="12" fill="#e2ecee" stroke="#aacbd0"/>
  <text x="1014" y="437" text-anchor="middle" fill="#326b80" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">LSTM</text>
  <path d="M1014 457v24M1006 474l8 9 8-9" fill="none" stroke="#d58146" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="913" y="490" width="88" height="35" rx="17" fill="#a95018"/><text x="957" y="513" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">PD</text>
  <rect x="1027" y="490" width="88" height="35" rx="17" fill="#427b91"/><text x="1071" y="513" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">Control</text>

  <line x1="45" y1="574" x2="1155" y2="574" stroke="#d8c9b8"/>
  <text x="45" y="614" fill="#292522" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">Evaluation context</text>
  <text x="45" y="644" fill="#6e6862" font-family="Arial,Helvetica,sans-serif" font-size="18">Public auditory Oddball EEG · 24 matched PD–control pairs · PD OFF and PD ON evaluated separately</text>
</svg>
